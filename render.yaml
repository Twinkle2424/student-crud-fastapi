# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the FastAPI app (API + dashboard + Swagger) as one web service.
services:
  - type: web
    name: student-crud-fastapi
    runtime: python
    plan: free
    branch: main
    autoDeploy: true                 # redeploy on every push to main
    buildCommand: pip install -r requirements.txt
    # Render provides $PORT; one process keeps a single in-memory student list
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
